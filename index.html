<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planes de Suscripción</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container py-5">
        <h2 class="text-center fw-bold mb-5">Elige tu Plan de Suscripción</h2>
        <div class="row g-4 align-items-stretch">
            <!-- Plan 1 -->
            <div class="col-12 col-md-4">
                <div class="card h-100 bg-light shadow-sm text-center">
                    <div class="card-body d-flex flex-column justify-content-between p-4">
                        <div>
                            <h4 class="card-title fw-bold">Plan Estudiante</h4>
                            <p class="display-4 fw-bold my-4">$9.99<span class="fs-5 fw-normal">/mes</span></p>
                        </div>
                        <a href="#" class="btn btn-outline-primary w-100">Elegir Plan</a>
                    </div>
                </div>
            </div>
            <!-- Plan 2 -->
            <div class="col-12 col-md-4">
                <div class="card h-100 bg-primary text-white shadow text-center">
                    <div class="card-body d-flex flex-column justify-content-between p-4">
                        <div>
                            <span class="badge bg-warning text-dark mb-2">Más Popular</span>
                            <h4 class="card-title fw-bold">Plan Pro VIP</h4>
                            <p class="display-4 fw-bold my-4">$24.99<span class="fs-5 fw-normal">/mes</span></p>
                        </div>
                        <a href="#" class="btn btn-warning fw-bold w-100">Elegir Plan</a>
                    </div>
                </div>
            </div>
            <!-- Plan 3 -->
            <div class="col-12 col-md-4">
                <div class="card h-100 bg-dark text-white shadow-sm text-center">
                    <div class="card-body d-flex flex-column justify-content-between p-4">
                        <div>
                            <h4 class="card-title fw-bold">Plan Institucional</h4>
                            <p class="display-4 fw-bold my-4">$79.99<span class="fs-5 fw-normal">/mes</span></p>
                        </div>
                        <a href="#" class="btn btn-outline-light w-100">Elegir Plan</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
